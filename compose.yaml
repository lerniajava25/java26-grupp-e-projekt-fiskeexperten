services:
  postgis:
    image: postgis/postgis:17-3.5
    container_name: postgis-db
    environment:
      POSTGRES_DB: gis
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: byt_till_ett_starkt_losenord
    ports:
      - "127.0.0.1:5432:5432"
    shm_size: "256mb"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appuser -d gis"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  pgdata: