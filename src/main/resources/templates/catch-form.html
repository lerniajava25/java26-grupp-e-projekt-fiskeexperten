<div th:fragment="catchForm" xmlns:th="http://www.thymeleaf.org" data-panel-backdrop hidden class="fixed inset-0 z-30 flex justify-end bg-lake/40">
    <aside role="dialog" aria-modal="true" aria-labelledby="catch-form-title" data-panel class="h-full w-full max-w-md overflow-y-auto bg-background p-6 shadow-soft">
        <div class="flex items-center justify-between">
            <h2 id="catch-form-title" class="text-2xl font-bold">Registrera fångst</h2>
            <button type="button" data-close-panel aria-label="Stäng formuläret" class="rounded p-2 text-xl">✕</button>
        </div>
        <p class="mt-3 text-sm text-muted-foreground">Demonstration: ingen fångst kan sparas.</p>
        <div aria-disabled="true" class="mt-6 flex h-40 flex-col items-center justify-center gap-2 rounded-2xl border-2 border-dashed border-primary/40 bg-muted text-muted-foreground">
            <svg aria-hidden="true" class="h-6 w-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4m-4 4 4-4 4 4M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/></svg>
            <span class="text-sm">Bilduppladdning är inte tillgänglig</span>
        </div>
        <button type="button" disabled class="mt-3 flex w-full items-center justify-center gap-2 rounded-xl bg-secondary py-2 text-sm font-semibold opacity-60">✦ Identifiera art med AI (inte tillgängligt)</button>
        <form onsubmit="return false">
            <div class="mt-4"><label for="catch-species" class="text-sm font-medium">Art</label><input id="catch-species" placeholder="t.ex. Gädda" class="mt-1 w-full rounded-xl border border-input bg-card px-3 py-2 outline-none"></div>
            <div class="mt-4"><label for="catch-weight" class="text-sm font-medium">Vikt (kg)</label><input id="catch-weight" inputmode="decimal" placeholder="4,2" class="mt-1 w-full rounded-xl border border-input bg-card px-3 py-2 outline-none"></div>
            <div class="mt-4"><label for="catch-length" class="text-sm font-medium">Längd (cm)</label><input id="catch-length" inputmode="decimal" placeholder="82" class="mt-1 w-full rounded-xl border border-input bg-card px-3 py-2 outline-none"></div>
            <div class="mt-4"><label for="catch-date" class="text-sm font-medium">Datum</label><input id="catch-date" type="date" class="mt-1 w-full rounded-xl border border-input bg-card px-3 py-2 outline-none"></div>
            <div class="mt-4"><p class="text-sm font-medium">Position</p><div class="mt-1 flex h-24 items-center justify-center rounded-xl bg-land p-3 text-center text-sm">Positionsavläsning är inte tillgänglig</div></div>
            <button type="button" disabled class="mt-6 w-full rounded-xl bg-primary py-3 font-semibold text-primary-foreground opacity-60">Spara fångst (inte tillgängligt)</button>
        </form>
    </aside>
</div>
